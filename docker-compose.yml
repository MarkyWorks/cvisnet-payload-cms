services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "npm ci && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cvisnet_payload:cvisnet_payload@postgres:5432/cvisnet_payload

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: cvisnet_payload
      POSTGRES_PASSWORD: cvisnet_payload
      POSTGRES_DB: cvisnet_payload
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cvisnet_payload -d cvisnet_payload']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  node_modules:
